# FN Amplifications - Slimefun Legacy Edition
# Target: Minecraft 1.21.11+ / Paper 26.2 and Paper-derived servers.

# Retained for compatibility with existing installations.
# On modern servers this controls whether the newer-material recipes are enabled.
New-Recipe-Integration: true

# Armor effect validator interval in seconds.
armor-update-period: 10

# Enable or disable addon modules.
# Disabled categories are removed from the Slimefun guide.
Enable-Machineries: true
Enable-Material-Generators: true
Enable-Gems: true
Enable-Gears: true
Enable-Mystery-Sticks: true
Enable-Solar-Generators: true
Enable-PowerXpansion: true
Enable-Staffs: true
Enable-Quivers: true
Enable-Misc: true

# Allow material generators to break over time.
Enable-Mat-Gen-Break-Over-Time: true

# Drop the broken generator variant when a material generator is broken.
Enable-Mat-Gen-Broken-Drop: true
