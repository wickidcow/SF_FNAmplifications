name: FNAmplifications
version: '${project.version}'
main: ne.fnfal113.fnamplifications.FNAmplifications
api-version: '1.21'
authors: [ FN_FAL113, wickidcow ]
description: Slimefun Legacy continuation of FN Amplifications for Minecraft 1.21.11+ and Paper 26.2.
website: https://github.com/wickidcow/SF_FNAmplifications
depend: [ Slimefun ]
softdepend:
  - SimpleMaterialGenerators
  - Vault
commands:
  fngear:
    description: Check worn FN Gear progression.
    default: true
    usage: /<command>
  fnshockwavetest:
    description: Test the Shockwave Gem effect.
    default: op
    usage: /<command>
permissions:
  fngear.levelupgears:
    description: Allows FN Gear level progression.
    default: op
  fnshockwave.test:
    description: Allows testing the Shockwave Gem effect.
    default: op
