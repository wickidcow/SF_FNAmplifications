name: Build FN Amplifications Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: "4.2.7"
  OUTPUT_NAME: "SF_FNAmplifications4.2.7.jar"

jobs:
  compatibility:
    name: ${{ matrix.slimefun }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slimefun: [legacy, united]

    steps:
      - name: Checkout FN Amplifications
        uses: actions/checkout@v6

      - name: Verify FN Doctor quiver reconciliation
        run: python3 scripts/verify_doctor_quiver.py .

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Checkout Slimefun Legacy
        if: matrix.slimefun == 'legacy'
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy

      - name: Publish Slimefun Legacy API locally
        if: matrix.slimefun == 'legacy'
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=FNAMPLIFICATIONS-LEGACY-SNAPSHOT --no-daemon

      - name: Checkout Slimefun United
        if: matrix.slimefun == 'united'
        uses: actions/checkout@v6
        with:
          repository: Slimefun-United/Slimefun-United
          ref: dev
          path: .deps/Slimefun-United

      - name: Set up Java 21 for Slimefun United source build
        if: matrix.slimefun == 'united'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Publish Slimefun United API locally
        if: matrix.slimefun == 'united'
        working-directory: .deps/Slimefun-United
        run: mvn -B -DskipTests install

      - name: Restore Java 25 for FN Amplifications validation
        if: matrix.slimefun == 'united'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve Slimefun coordinate
        id: sf
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.slimefun }}" == "legacy" ]]; then
            echo 'group=com.github.slimefun' >> "$GITHUB_OUTPUT"
            echo 'artifact=Slimefun' >> "$GITHUB_OUTPUT"
            echo 'version=FNAMPLIFICATIONS-LEGACY-SNAPSHOT' >> "$GITHUB_OUTPUT"
          else
            VERSION="$(mvn -q -f .deps/Slimefun-United/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
            echo 'group=io.github.slimefun_united' >> "$GITHUB_OUTPUT"
            echo 'artifact=slimefun-united' >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Paper 1.21.11 release floor
        if: matrix.slimefun == 'legacy'
        run: >-
          mvn -B clean verify
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=${{ steps.sf.outputs.group }}
          -Dslimefun.artifactId=${{ steps.sf.outputs.artifact }}
          -Dslimefun.version=${{ steps.sf.outputs.version }}

      - name: Verify Paper 26.2 primary
        run: >-
          mvn -B clean verify
          -Dpaper.version=26.2.build.112-stable
          -Dslimefun.groupId=${{ steps.sf.outputs.group }}
          -Dslimefun.artifactId=${{ steps.sf.outputs.artifact }}
          -Dslimefun.version=${{ steps.sf.outputs.version }}

      - name: Verify Paper 26.3 alpha
        run: >-
          mvn -B clean verify
          -Dpaper.version=26.3-rc-3.build.1-alpha
          -Dslimefun.groupId=${{ steps.sf.outputs.group }}
          -Dslimefun.artifactId=${{ steps.sf.outputs.artifact }}
          -Dslimefun.version=${{ steps.sf.outputs.version }}

      - name: Rebuild universal release JAR from Paper 1.21.11
        if: matrix.slimefun == 'legacy'
        run: >-
          mvn -B clean package
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=${{ steps.sf.outputs.group }}
          -Dslimefun.artifactId=${{ steps.sf.outputs.artifact }}
          -Dslimefun.version=${{ steps.sf.outputs.version }}

      - name: Stage raw release JAR
        if: matrix.slimefun == 'legacy'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s "target/${OUTPUT_NAME}"
          cp "target/${OUTPUT_NAME}" "dist/${OUTPUT_NAME}"
          jar tf "dist/${OUTPUT_NAME}" | grep -Fxq 'plugin.yml'
          unzip -p "dist/${OUTPUT_NAME}" plugin.yml | grep -Fq "version: ${RELEASE_VERSION}"
          python3 - <<'PY'
          import pathlib, struct, zipfile
          jar = pathlib.Path('dist/SF_FNAmplifications4.2.7.jar')
          max_major = 0
          with zipfile.ZipFile(jar) as zf:
              for name in zf.namelist():
                  if name.endswith('.class'):
                      data = zf.read(name)[:8]
                      if data[:4] == b'\xca\xfe\xba\xbe':
                          max_major = max(max_major, struct.unpack('>H', data[6:8])[0])
          print(f'{jar}: maximum class major version {max_major}')
          if max_major > 65:
              raise SystemExit('JAR contains classes newer than Java 21 bytecode')
          PY
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Upload raw JAR artifact
        if: matrix.slimefun == 'legacy'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

  release:
    name: Publish 4.2.7 raw JAR
    needs: compatibility
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release target
        uses: actions/checkout@v6

      - name: Download validated raw JAR
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          JAR="dist/${OUTPUT_NAME}"
          test -s "$JAR"
          NOTES="FNAmplifications 4.2.7 keeps the Paper 26.2 startup/VersionedMaterial hotfix and Doctor quiver reconciliation, restores a Paper 1.21.11 / Java 21 universal release baseline, and adds explicit Paper 26.3 alpha compatibility validation. Slimefun Legacy remains primary and Slimefun United remains compile-validated."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "SF_FNAmplifications ${RELEASE_VERSION}" --notes "$NOTES"
          else
            gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SF_FNAmplifications ${RELEASE_VERSION}" --notes "$NOTES"
          fi
