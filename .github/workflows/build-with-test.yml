name: Build FN Amplifications Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: "4.2.6"
  OUTPUT_NAME: "SF_FNAmplifications4.2.6.jar"

jobs:
  compatibility:
    name: ${{ matrix.slimefun }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slimefun: [legacy, united]

    steps:
      - name: Checkout FN Amplifications
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Checkout Slimefun Legacy
        if: matrix.slimefun == 'legacy'
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy

      - name: Publish Slimefun Legacy API locally
        if: matrix.slimefun == 'legacy'
        working-directory: .deps/Slimefun-Legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=FNAMPLIFICATIONS-LEGACY-SNAPSHOT --no-daemon

      - name: Checkout Slimefun United
        if: matrix.slimefun == 'united'
        uses: actions/checkout@v6
        with:
          repository: Slimefun-United/Slimefun-United
          ref: dev
          path: .deps/Slimefun-United

      - name: Set up Java 21 for Slimefun United source build
        if: matrix.slimefun == 'united'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Publish Slimefun United API locally
        if: matrix.slimefun == 'united'
        working-directory: .deps/Slimefun-United
        run: mvn -B -DskipTests install

      - name: Restore Java 25 for FN Amplifications validation
        if: matrix.slimefun == 'united'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Minecraft 1.21.11+ / Paper 26.2
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.slimefun }}" == "legacy" ]]; then
            SF_GROUP="com.github.slimefun"
            SF_ARTIFACT="Slimefun"
            SF_VERSION="FNAMPLIFICATIONS-LEGACY-SNAPSHOT"
          else
            SF_GROUP="io.github.slimefun_united"
            SF_ARTIFACT="slimefun-united"
            SF_VERSION="$(mvn -q -f .deps/Slimefun-United/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          fi

          echo "Testing against $SF_GROUP:$SF_ARTIFACT:$SF_VERSION on Paper 26.2+"
          mvn -B clean verify \
            -Dpaper.version='[26.2.build,)' \
            -Dslimefun.groupId="$SF_GROUP" \
            -Dslimefun.artifactId="$SF_ARTIFACT" \
            -Dslimefun.version="$SF_VERSION"

      - name: Stage raw release JAR
        if: matrix.slimefun == 'legacy'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s "target/${OUTPUT_NAME}"
          cp "target/${OUTPUT_NAME}" "dist/${OUTPUT_NAME}"
          jar tf "dist/${OUTPUT_NAME}" | grep -Fxq 'plugin.yml'
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Upload raw JAR artifact
        if: matrix.slimefun == 'legacy'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

  release:
    name: Publish 4.2.6 raw JAR
    needs: compatibility
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release target
        uses: actions/checkout@v6

      - name: Download validated raw JAR
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist

      - name: Verify release JAR
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/${OUTPUT_NAME}"
          jar tf "dist/${OUTPUT_NAME}" | grep -Fxq 'plugin.yml'
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          JAR="dist/${OUTPUT_NAME}"
          NOTES_FILE="release-notes.md"

          cat > "$NOTES_FILE" <<'EOF'
          # SF_FNAmplifications 4.2.6 — Paper 26.2 Startup Hotfix

          This hotfix fixes FN Amplifications failing during startup on Paper 26.2 before item registration could complete.

          ## Fixed
          - Fixed `ExceptionInInitializerError` from `VersionedMaterial` on Paper 26.2.
          - Removed the obsolete Bukkit version-string parser that attempted to parse `build` as an integer from Paper versions such as `26.2.build.121-stable`.
          - FN Amplifications now uses `Material.SHORT_GRASS` directly because this maintained fork targets Minecraft 1.21.11+ only.
          - Added a regression test that loads the compatibility material class during Maven verification.

          ## Compatibility
          - Minecraft 1.21.11+
          - Paper 26.2 primary target
          - API-compatible Paper forks such as Purpur
          - Java 25
          - Slimefun Legacy primary
          - Slimefun United compatibility compile validated in CI

          ## Upgrade
          Replace `SF_FNAmplifications4.2.5.jar` with `SF_FNAmplifications4.2.6.jar` while the server is stopped. Do not run both JARs together.

          Original FN Amplifications by FN_FAL113. This is an independent community-maintained continuation.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "SF_FNAmplifications ${RELEASE_VERSION}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SF_FNAmplifications ${RELEASE_VERSION}" --notes-file "$NOTES_FILE"
          fi
